name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: moon version --all

      - name: Update registry index
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Interface check
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Check
        run: |
          moon check --deny-warn --target native
          moon check --deny-warn --target js
          moon check --deny-warn --target wasm-gc

      - name: Test (native)
        run: moon test --target native

      - name: Test (js)
        run: moon test --target js

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

      - name: Run the demo
        run: COLUMNS=100 moon run --target native cmd/demo

      - name: Run the rich command (native)
        run: |
          moon build --target native cmd/rich
          COLUMNS=80 moon run --target native cmd/rich -- README.md --force-terminal
          COLUMNS=80 moon run --target native cmd/rich -- cli/testdata/deniro.csv --head 5
          echo '{"ok": true, "n": [1, 2]}' | COLUMNS=80 moon run --target native cmd/rich -- - --json

      - name: Run the rich command (wasm)
        run: |
          moon build --target wasm cmd/rich
          COLUMNS=80 moon run --target wasm cmd/rich -- cli/testdata/sample.py -n -g
          COLUMNS=80 moon run --target wasm cmd/rich -- "Hello [b]World[/b]!" -p -a rounded -c
